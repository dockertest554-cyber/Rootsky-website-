<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* Critical, inlined on purpose. index.css is injected by JS (it is
         imported from main.jsx), so on first paint the browser would render
         the skip link unstyled and visible for a few frames. These three
         declarations must land before anything else does. */
      .skip-link { position: absolute; top: -100px; left: 16px; z-index: 10000; }
      .skip-link:focus { top: 16px; }
    </style>

    <!-- Poppins: 300 for the lockup, 400/500 for headline + UI, 700 for the wordmark -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <meta name="description" content="Rootsky Systems — AI-powered network monitoring and IT infrastructure solutions. OctetNMS predicts failures, maps topology, and keeps your network online." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rootsky Systems — AI-Powered Network Intelligence" />
    <meta property="og:description" content="OctetNMS watches, understands, and acts on your entire infrastructure — predicting failures before they happen." />
    <meta property="og:url" content="https://rootskysystems.com" />
    <meta property="og:image" content="https://rootskysystems.com/octet-full.png" />
    <meta property="og:site_name" content="Rootsky Systems" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rootsky Systems — AI-Powered Network Intelligence" />
    <meta name="twitter:description" content="OctetNMS watches, understands, and acts on your entire infrastructure — predicting failures before they happen." />
    <meta name="twitter:image" content="https://rootskysystems.com/octet-full.png" />

    <title>Rootsky Systems — Connectivity & IT Solutions</title>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Rootsky Systems",
      "url": "https://rootskysystems.com",
      "logo": "https://rootskysystems.com/rootsky-full.png",
      "description": "AI-powered network monitoring and IT infrastructure solutions.",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-98765-43210",
        "contactType": "sales",
        "email": "hello@rootskysystems.com"
      },
      "sameAs": [
        "https://linkedin.com/company/rootsky-systems",
        "https://x.com/rootskysystems",
        "https://github.com/rootsky-systems"
      ]
    }
    </script>

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What can OctetNMS monitor?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Network devices, routers, switches, firewalls, servers, applications, bandwidth, performance, logs, availability, and full topology — across multiple vendors from one dashboard."
          }
        },
        {
          "@type": "Question",
          "name": "Is it cloud or on-premise?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Both. OctetNMS supports cloud, on-premise, and hybrid deployments so it fits your infrastructure and compliance needs."
          }
        },
        {
          "@type": "Question",
          "name": "How does the AI help?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It predicts failures, finds root causes, prioritizes alerts, detects anomalies, summarizes logs, and recommends fixes — reducing noise and speeding up resolution."
          }
        },
        {
          "@type": "Question",
          "name": "Does it support multi-vendor networks?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Via SNMP and open APIs, OctetNMS works across routers, switches, firewalls, wireless controllers, cameras, and telecom devices from different vendors."
          }
        },
        {
          "@type": "Question",
          "name": "How fast can we deploy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Auto-discovery maps your environment quickly, so most teams are monitoring within a single deployment cycle, with our team supporting throughout."
          }
        }
      ]
    }
    </script>
  </head>

    <a href="#main" class="skip-link">Skip to main content</a>

</html>
